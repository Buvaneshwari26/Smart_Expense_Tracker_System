<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Savings Goals — Smart Expense Tracker</title>
  <meta name="description" content="Set financial goals and track your savings progress over time."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-piggy-bank-fill me-2" style="color:var(--accent);font-size:1.2rem;"></i>Savings Goals</h2>
          <p>Plan and track your target savings goals</p>
        </div>
        <div id="add-btn-wrapper">
          <button class="btn btn-glow" onclick="openModal()"><i class="bi bi-plus-lg me-2"></i>New Savings Goal</button>
        </div>
      </div>

      <div class="row g-4" id="goals-container">
        <!-- Goal Cards Populated via JS -->
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-glass">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">New Savings Goal</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:20px 24px;">
        <form id="itemForm" class="glass-form">
          <input type="hidden" id="itemId">
          <div class="mb-3">
            <label class="form-label">Goal Name</label>
            <input type="text" class="form-control" id="goalName" placeholder="e.g. Emergency Fund, New Laptop" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Target Amount (₹)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="targetAmount" placeholder="0.00" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Current Saved (₹)</label>
              <input type="number" step="0.01" min="0" class="form-control" id="currentAmount" placeholder="0.00" value="0">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Target Date</label>
            <input type="date" class="form-control" id="targetDate" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-glow" onclick="saveItem()"><i class="bi bi-check2-circle me-2"></i>Save Goal</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('savings.html');
  const isReadOnly = Auth.isReadOnly();
  if (isReadOnly) document.getElementById('add-btn-wrapper').style.display = 'none';

  let myModal = new bootstrap.Modal(document.getElementById('itemModal'));

  async function loadData() {
    UI.showLoading();
    try {
      const data = await Api.get(`/savings-goals/user/${Api.getUserId()}`);
      const container = document.getElementById('goals-container');
      container.innerHTML = '';
      const list = Array.isArray(data) ? data : [];
      if (list.length > 0) {
        list.forEach((item, i) => {
          const pct = Math.min(100, item.percentage || (item.targetAmount > 0 ? (item.currentAmount / item.targetAmount)*100 : 0));
          const actions = isReadOnly ? '' : `<div class="mt-3 pt-3 d-flex gap-2 justify-content-end" style="border-top:1px solid var(--glass-border);">
            <button class="btn btn-sm btn-outline-info" onclick='editItem(${JSON.stringify(item).replace(/'/g,"&#39;")})'><i class="bi bi-pencil me-1"></i>Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})"><i class="bi bi-trash me-1"></i>Delete</button>
          </div>`;

          container.innerHTML += `<div class="col-lg-4 col-md-6 animate-in" style="animation-delay:${i*0.05}s;">
            <div class="glass-card h-100 d-flex flex-direction-column justify-content-between">
              <div>
                <div class="d-flex align-items-center justify-content-between mb-3">
                  <h5 class="mb-0 fw-700" style="font-size:1.05rem;">${item.goalName}</h5>
                  <span class="badge" style="background:rgba(78,204,163,0.12);color:var(--accent);border:1px solid rgba(78,204,163,0.25);">${pct.toFixed(0)}%</span>
                </div>
                <div class="progress-bar-custom mb-3" style="height:10px;">
                  <div class="fill" style="width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--brand-primary));"></div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span style="font-size:0.8rem;color:var(--text-secondary);">Saved:</span>
                  <span style="font-weight:700;color:var(--accent);">${UI.formatCurrency(item.currentAmount)}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span style="font-size:0.8rem;color:var(--text-secondary);">Target:</span>
                  <span style="font-weight:700;">${UI.formatCurrency(item.targetAmount)}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span style="font-size:0.8rem;color:var(--text-secondary);">Target Date:</span>
                  <span style="font-size:0.8rem;color:var(--text-muted);">${UI.formatDate(item.targetDate)}</span>
                </div>
              </div>
              ${actions}
            </div>
          </div>`;
        });
      } else {
        container.innerHTML = `<div class="col-12"><div class="glass-card text-center py-5" style="color:var(--text-muted);"><i class="bi bi-piggy-bank d-block mb-2" style="font-size:3rem;opacity:0.35;"></i><h5>No Savings Goals Yet</h5><p class="small">Create your first goal to start tracking your savings targets!</p></div></div>`;
      }
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  function openModal() {
    if (isReadOnly) return;
    document.getElementById('itemForm').reset();
    document.getElementById('itemId').value = '';
    document.getElementById('modalTitle').textContent = 'New Savings Goal';
    myModal.show();
  }

  function editItem(item) {
    if (isReadOnly) return;
    document.getElementById('itemId').value = item.id;
    document.getElementById('goalName').value = item.goalName;
    document.getElementById('targetAmount').value = item.targetAmount;
    document.getElementById('currentAmount').value = item.currentAmount;
    document.getElementById('targetDate').value = item.targetDate;
    document.getElementById('modalTitle').textContent = 'Edit Savings Goal';
    myModal.show();
  }

  async function saveItem() {
    if (isReadOnly) return;
    const form = document.getElementById('itemForm');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.getElementById('itemId').value;
    const payload = {
      goalName: document.getElementById('goalName').value,
      targetAmount: document.getElementById('targetAmount').value,
      currentAmount: document.getElementById('currentAmount').value || 0,
      targetDate: document.getElementById('targetDate').value
    };
    UI.showLoading();
    try {
      if (id) { await Api.put(`/savings-goals/${id}?userId=${Api.getUserId()}`, payload); UI.showToast('Savings goal updated ✅'); }
      else { await Api.post(`/savings-goals?userId=${Api.getUserId()}`, payload); UI.showToast('Savings goal created ✅'); }
      myModal.hide(); loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function deleteItem(id) {
    if (isReadOnly) return;
    if (!confirm('Delete this savings goal?')) return;
    UI.showLoading();
    try {
      await Api.del(`/savings-goals/${id}?userId=${Api.getUserId()}`);
      UI.showToast('Goal deleted ✅'); loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  loadData();
</script>
</body>
</html>
