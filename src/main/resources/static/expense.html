<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expenses — Smart Expense Tracker</title>
  <meta name="description" content="Track and manage your expenses efficiently."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div>
        <div class="brand-text">ExpenseTracker</div>
        <div class="brand-tagline">Smart Finance</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-credit-card-fill me-2" style="color:var(--expense-red);font-size:1.2rem;"></i>Expense Management</h2>
          <p>Track your spending and outgoing cash flow</p>
        </div>
        <div id="add-expense-btn-wrapper">
          <button class="btn btn-glow" id="add-expense-btn" onclick="openModal()">
            <i class="bi bi-plus-lg me-2"></i>Add Expense
          </button>
        </div>
      </div>

      <!-- Search / Filter -->
      <div class="glass-card mb-4">
        <form id="searchForm" class="row g-3 align-items-end glass-form">
          <div class="col-md-3">
            <label class="form-label">Search Keyword</label>
            <input type="text" class="form-control" id="searchKeyword" placeholder="Description or notes…">
          </div>
          <div class="col-md-2">
            <label class="form-label">Category</label>
            <select class="form-select" id="searchCategory"><option value="">All Categories</option></select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" id="searchStart">
          </div>
          <div class="col-md-2">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" id="searchEnd">
          </div>
          <div class="col-md-3 d-flex gap-2">
            <button type="button" class="btn btn-outline-primary flex-fill" onclick="loadData(0)"><i class="bi bi-search me-1"></i>Search</button>
            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="resetSearch()"><i class="bi bi-x-circle me-1"></i>Reset</button>
          </div>
        </form>
      </div>

      <!-- Export Buttons -->
      <div class="glass-card mb-4 d-flex flex-wrap gap-2" style="padding:16px 20px;">
        <button class="btn btn-outline-success btn-sm" onclick="Api.download(`/expenses/export/excel?userId=${Api.getUserId()}`, 'expenses.xlsx')">
          <i class="bi bi-file-earmark-excel me-2"></i>Export Excel
        </button>
        <button class="btn btn-outline-info btn-sm" onclick="Api.download(`/expenses/export/csv?userId=${Api.getUserId()}`, 'expenses.csv')">
          <i class="bi bi-filetype-csv me-2"></i>Export CSV
        </button>
        <button class="btn btn-outline-danger btn-sm" onclick="Api.download(`/expenses/export/pdf?userId=${Api.getUserId()}`, 'expenses.pdf')">
          <i class="bi bi-file-earmark-pdf me-2"></i>Export PDF
        </button>
      </div>

      <!-- Table -->
      <div class="glass-card">
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
                <th id="actions-header">Actions</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div id="pagination" class="mt-4 d-flex justify-content-end"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-glass">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Expense</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="padding:20px 24px;">
        <form id="itemForm" class="glass-form">
          <input type="hidden" id="itemId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Amount (₹)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="amount" placeholder="0.00" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <div class="col-12">
              <label class="form-label">Category</label>
              <select class="form-select" id="categoryId" required>
                <option value="">Select Category</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="2" placeholder="Optional notes…"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-glow" onclick="saveItem()"><i class="bi bi-check2-circle me-2"></i>Save Expense</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('expense.html');

  const isReadOnly = Auth.isReadOnly();
  // Hide add button and actions column for ANALYST
  if (isReadOnly) {
    document.getElementById('add-expense-btn-wrapper').style.display = 'none';
    const actHdr = document.getElementById('actions-header');
    if (actHdr) actHdr.style.display = 'none';
  }

  let myModal = new bootstrap.Modal(document.getElementById('itemModal'));
  let categories = [];

  async function loadCategories() {
    try {
      const data = await Api.get(`/categories?userId=${Api.getUserId()}`);
      categories = Array.isArray(data) ? data.filter(c => c.type === 'EXPENSE') : [];
      const opts = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('categoryId').innerHTML = '<option value="">Select Category</option>' + opts;
      document.getElementById('searchCategory').innerHTML = '<option value="">All Categories</option>' + opts;
    } catch (err) {
      console.error('Failed to load categories', err);
    }
  }

  function resetSearch() {
    document.getElementById('searchForm').reset();
    loadData(0);
  }

  async function loadData(page = 0) {
    UI.showLoading();
    try {
      const keyword = document.getElementById('searchKeyword').value.trim();
      const cat = document.getElementById('searchCategory').value;
      const start = document.getElementById('searchStart').value;
      const end = document.getElementById('searchEnd').value;

      let url = `/expenses/search?userId=${Api.getUserId()}&page=${page}&size=10`;
      if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
      if (cat) url += `&categoryId=${cat}`;
      if (start) url += `&startDate=${start}`;
      if (end) url += `&endDate=${end}`;

      const data = await Api.get(url);
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (data.content && data.content.length > 0) {
        data.content.forEach(item => {
          const actionsCell = isReadOnly
            ? ''
            : `<td>
                <button class="btn btn-sm btn-outline-info me-1" onclick='editItem(${JSON.stringify(item).replace(/'/g,"&#39;")})' title="Edit"><i class="bi bi-pencil-fill"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})" title="Delete"><i class="bi bi-trash-fill"></i></button>
              </td>`;
          tbody.innerHTML += `<tr>
            <td style="font-size:0.82rem;">${UI.formatDate(item.date)}</td>
            <td><span class="badge expense">${item.categoryName || '—'}</span></td>
            <td style="color:var(--expense-red);font-weight:700;">-${UI.formatCurrency(item.amount)}</td>
            <td style="font-size:0.82rem;color:var(--text-secondary);">${item.description || '—'}</td>
            ${actionsCell}
          </tr>`;
        });
      } else {
        const cols = isReadOnly ? 4 : 5;
        tbody.innerHTML = `<tr><td colspan="${cols}" class="text-center py-5" style="color:var(--text-muted);"><i class="bi bi-inbox d-block mb-2" style="font-size:2rem;opacity:0.4;"></i>No expense records found</td></tr>`;
      }
      UI.renderPagination(document.getElementById('pagination'), data, loadData);
    } catch (err) {
      UI.showToast(err.message, 'error');
    } finally {
      UI.hideLoading();
    }
  }

  function openModal() {
    if (isReadOnly) return;
    document.getElementById('itemForm').reset();
    document.getElementById('itemId').value = '';
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('modalTitle').textContent = 'Add Expense';
    myModal.show();
  }

  function editItem(item) {
    if (isReadOnly) return;
    document.getElementById('itemId').value = item.id;
    document.getElementById('amount').value = item.amount;
    document.getElementById('date').value = item.date;
    document.getElementById('categoryId').value = item.categoryId;
    document.getElementById('description').value = item.description || '';
    document.getElementById('modalTitle').textContent = 'Edit Expense';
    myModal.show();
  }

  async function saveItem() {
    if (isReadOnly) { UI.showToast('Read-only mode: modifications not allowed.', 'warning'); return; }
    const form = document.getElementById('itemForm');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.getElementById('itemId').value;
    const payload = {
      amount: document.getElementById('amount').value,
      date: document.getElementById('date').value,
      categoryId: document.getElementById('categoryId').value,
      description: document.getElementById('description').value
    };
    UI.showLoading();
    try {
      if (id) {
        await Api.put(`/expenses/${id}?userId=${Api.getUserId()}`, payload);
        UI.showToast('Expense updated successfully ✅');
      } else {
        await Api.post(`/expenses?userId=${Api.getUserId()}`, payload);
        UI.showToast('Expense added successfully ✅');
      }
      myModal.hide();
      loadData(0);
    } catch (err) {
      UI.showToast(err.message, 'error');
    } finally {
      UI.hideLoading();
    }
  }

  async function deleteItem(id) {
    if (isReadOnly) { UI.showToast('Read-only mode: modifications not allowed.', 'warning'); return; }
    if (!confirm('Are you sure you want to delete this expense?')) return;
    UI.showLoading();
    try {
      await Api.del(`/expenses/${id}?userId=${Api.getUserId()}`);
      UI.showToast('Expense deleted successfully ✅');
      loadData(0);
    } catch (err) {
      UI.showToast(err.message, 'error');
    } finally {
      UI.hideLoading();
    }
  }

  loadCategories().then(() => loadData(0));
</script>
</body>
</html>
