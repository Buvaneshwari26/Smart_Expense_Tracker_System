<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel — Smart Expense Tracker</title>
  <meta name="description" content="System statistics, audit log monitoring, and administration."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-shield-fill-check me-2" style="color:var(--brand-primary-light);font-size:1.2rem;"></i>System Administration Panel</h2>
          <p>Global statistics, activity audit trail, and system overview</p>
        </div>
        <div class="d-flex gap-2">
          <a href="admin-users.html" class="btn btn-glow"><i class="bi bi-people-fill me-2"></i>User Management</a>
        </div>
      </div>

      <!-- KPI Stat Cards -->
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="stat-card glass-card balance">
            <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
            <div class="stat-details">
              <div class="stat-label">Total Users</div>
              <div class="stat-value" id="admin-total-users">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card glass-card income">
            <div class="stat-icon"><i class="bi bi-person-check-fill"></i></div>
            <div class="stat-details">
              <div class="stat-label">Active Users</div>
              <div class="stat-value" id="admin-active-users">0</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card glass-card expense">
            <div class="stat-icon"><i class="bi bi-receipt"></i></div>
            <div class="stat-details">
              <div class="stat-label">Total Expenses</div>
              <div class="stat-value" id="admin-total-expenses">₹0.00</div>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="stat-card glass-card savings">
            <div class="stat-icon"><i class="bi bi-cash-stack"></i></div>
            <div class="stat-details">
              <div class="stat-label">Total Incomes</div>
              <div class="stat-value" id="admin-total-incomes">₹0.00</div>
            </div>
          </div>
        </div>
      </div>

      <!-- System Activity Logs -->
      <div class="glass-card mb-4">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <h5 class="mb-0 fw-700" style="font-size:1rem;"><i class="bi bi-list-task me-2" style="color:var(--brand-primary-light);"></i>System Activity Log</h5>
          <button class="btn btn-outline-secondary btn-sm" onclick="loadActivityLogs(0)"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        </div>
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr><th>Timestamp</th><th>User</th><th>Action</th><th>Details</th></tr>
            </thead>
            <tbody id="logs-tbody"></tbody>
          </table>
        </div>
        <div id="logs-pagination" class="mt-3 d-flex justify-content-end"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth('ADMIN');
  UI.initSidebar('admin.html');

  async function loadAdminStats() {
    UI.showLoading();
    try {
      const stats = await Api.get('/admin/stats');
      document.getElementById('admin-total-users').textContent = stats.totalUsers || 0;
      document.getElementById('admin-active-users').textContent = stats.activeUsers || 0;
      document.getElementById('admin-total-expenses').textContent = UI.formatCurrency(stats.totalExpenseAmount || 0);
      document.getElementById('admin-total-incomes').textContent = UI.formatCurrency(stats.totalIncomeAmount || 0);
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function loadActivityLogs(page = 0) {
    try {
      const logs = await Api.get(`/admin/activity-logs?page=${page}&size=10`);
      const tbody = document.getElementById('logs-tbody');
      tbody.innerHTML = '';
      if (logs.content && logs.content.length > 0) {
        logs.content.forEach(log => {
          tbody.innerHTML += `<tr>
            <td style="font-size:0.82rem;">${UI.formatDateTime(log.timestamp || log.createdDate)}</td>
            <td style="font-size:0.82rem;font-weight:600;">${log.username || 'System'}</td>
            <td><span class="badge admin">${log.action || 'ACTIVITY'}</span></td>
            <td style="font-size:0.82rem;color:var(--text-secondary);">${log.details || log.description || '—'}</td>
          </tr>`;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4" style="color:var(--text-muted);">No activity logs recorded yet.</td></tr>';
      }
      UI.renderPagination(document.getElementById('logs-pagination'), logs, loadActivityLogs);
    } catch (err) { console.error('Failed to load logs', err); }
  }

  loadAdminStats();
  loadActivityLogs(0);
</script>
</body>
</html>
