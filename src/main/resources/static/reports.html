<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports & Analytics — Smart Expense Tracker</title>
  <meta name="description" content="Detailed financial analytics, reports, and data exports."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-graph-up-arrow me-2" style="color:var(--brand-primary-light);font-size:1.2rem;"></i>Reports & Financial Analytics</h2>
          <p>Analyze spending trends, view breakdown, and export financial data</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-success btn-sm" onclick="Api.download(`/expenses/export/excel?userId=${Api.getUserId()}`, 'expense_report.xlsx')">
            <i class="bi bi-file-earmark-excel me-1"></i>Excel Report
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="Api.download(`/expenses/export/pdf?userId=${Api.getUserId()}`, 'expense_report.pdf')">
            <i class="bi bi-file-earmark-pdf me-1"></i>PDF Report
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div class="glass-card mb-4">
        <div class="row g-3 align-items-end glass-form">
          <div class="col-md-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" id="startDate">
          </div>
          <div class="col-md-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" id="endDate">
          </div>
          <div class="col-md-3">
            <label class="form-label">Type</label>
            <select class="form-select" id="reportType">
              <option value="ALL">All Transactions</option>
              <option value="EXPENSE">Expenses Only</option>
              <option value="INCOME">Income Only</option>
            </select>
          </div>
          <div class="col-md-3">
            <button type="button" class="btn btn-glow w-100" onclick="generateReport()"><i class="bi bi-filter me-2"></i>Generate Report</button>
          </div>
        </div>
      </div>

      <!-- Summary Stat Cards -->
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="stat-card glass-card income">
            <div class="stat-icon"><i class="bi bi-arrow-up-circle-fill"></i></div>
            <div class="stat-details">
              <div class="stat-label">Reported Income</div>
              <div class="stat-value" id="rep-income">₹0.00</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card glass-card expense">
            <div class="stat-icon"><i class="bi bi-arrow-down-circle-fill"></i></div>
            <div class="stat-details">
              <div class="stat-label">Reported Expense</div>
              <div class="stat-value" id="rep-expense">₹0.00</div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card glass-card balance">
            <div class="stat-icon"><i class="bi bi-wallet-fill"></i></div>
            <div class="stat-details">
              <div class="stat-label">Net Savings</div>
              <div class="stat-value" id="rep-net">₹0.00</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="glass-card">
            <h5 class="mb-4 fw-700" style="font-size:1rem;"><i class="bi bi-bar-chart-line-fill me-2" style="color:var(--brand-primary-light);"></i>Income vs Expense Trend</h5>
            <div class="chart-container">
              <canvas id="trendChart"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="glass-card">
            <h5 class="mb-4 fw-700" style="font-size:1rem;"><i class="bi bi-pie-chart-fill me-2" style="color:var(--accent);"></i>Category Breakdown</h5>
            <div class="chart-container" style="height:260px;">
              <canvas id="breakdownChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('reports.html');

  // Set default dates
  const now = new Date();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
  const today = now.toISOString().split('T')[0];
  document.getElementById('startDate').value = firstDay;
  document.getElementById('endDate').value = today;

  let trendChartInstance = null;
  let breakdownChartInstance = null;

  async function generateReport() {
    UI.showLoading();
    try {
      const summary = await Api.get('/dashboard/summary');
      document.getElementById('rep-income').textContent = UI.formatCurrency(summary.totalIncome);
      document.getElementById('rep-expense').textContent = UI.formatCurrency(summary.totalExpense);
      const net = (summary.totalIncome || 0) - (summary.totalExpense || 0);
      const netEl = document.getElementById('rep-net');
      netEl.textContent = UI.formatCurrency(net);
      netEl.style.color = net >= 0 ? 'var(--accent)' : 'var(--danger)';

      renderCharts(summary);
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  function renderCharts(summary) {
    const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') !== 'light';
    Chart.defaults.color = isDark ? '#94a3b8' : '#475569';
    Chart.defaults.borderColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';

    if (trendChartInstance) trendChartInstance.destroy();
    if (breakdownChartInstance) breakdownChartInstance.destroy();

    const ctxTrend = document.getElementById('trendChart').getContext('2d');
    trendChartInstance = new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [
          { label: 'Income', data: [45000, 52000, 48000, 61000, 55000, summary.totalIncome || 65000], borderColor: '#4ecca3', backgroundColor: 'rgba(78,204,163,0.1)', fill: true, tension: 0.4 },
          { label: 'Expense', data: [32000, 28000, 35000, 42000, 31000, summary.totalExpense || 39000], borderColor: '#f43f5e', backgroundColor: 'rgba(244,63,94,0.1)', fill: true, tension: 0.4 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: { y: { ticks: { callback: v => '₹' + (v/1000).toFixed(0) + 'k' } } }
      }
    });

    const ctxBreakdown = document.getElementById('breakdownChart').getContext('2d');
    breakdownChartInstance = new Chart(ctxBreakdown, {
      type: 'doughnut',
      data: {
        labels: [summary.topSpendingCategory || 'Food', 'Rent', 'Utilities', 'Shopping', 'Others'],
        datasets: [{ data: [35, 25, 15, 15, 10], backgroundColor: ['#6366f1', '#4ecca3', '#f59e0b', '#3b82f6', '#ec4899'], borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '70%',
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  generateReport();
</script>
</body>
</html>
