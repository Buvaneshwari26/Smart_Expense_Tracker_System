<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications — Smart Expense Tracker</title>
  <meta name="description" content="View system alerts, budget warnings, and savings goal milestones."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-bell-fill me-2" style="color:var(--warning);font-size:1.2rem;"></i>Notifications & Alerts</h2>
          <p>Stay updated on budget limits, financial goals, and security events</p>
        </div>
        <div>
          <button class="btn btn-outline-secondary btn-sm" onclick="markAllAsRead()"><i class="bi bi-check2-all me-1"></i>Mark All as Read</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr><th>Timestamp</th><th>Type</th><th>Message</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="notif-tbody"></tbody>
          </table>
        </div>
        <div id="notif-pagination" class="mt-4 d-flex justify-content-end"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('notifications.html');

  async function loadNotifications(page = 0) {
    UI.showLoading();
    try {
      const data = await Api.get(`/notifications?userId=${Api.getUserId()}&page=${page}&size=10`);
      const tbody = document.getElementById('notif-tbody');
      tbody.innerHTML = '';
      if (data.content && data.content.length > 0) {
        data.content.forEach(n => {
          const isRead = n.read || n.isRead;
          const typeBadge = n.type === 'WARNING' ? 'expense' : n.type === 'SUCCESS' ? 'income' : 'admin';
          tbody.innerHTML += `<tr style="${isRead ? 'opacity:0.65;' : 'font-weight:600;'}">
            <td style="font-size:0.82rem;">${UI.formatDateTime(n.timestamp || n.createdDate)}</td>
            <td><span class="badge ${typeBadge}">${n.type || 'INFO'}</span></td>
            <td style="font-size:0.875rem;">${n.message}</td>
            <td>
              <span class="badge ${isRead ? 'badge-secondary' : 'income'}" style="${isRead ? 'background:rgba(255,255,255,0.08);color:var(--text-muted);' : ''}">${isRead ? 'Read' : 'Unread'}</span>
            </td>
            <td>
              ${!isRead ? `<button class="btn btn-sm btn-outline-info" onclick="markAsRead(${n.id})"><i class="bi bi-check me-1"></i>Read</button>` : '—'}
            </td>
          </tr>`;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5" style="color:var(--text-muted);"><i class="bi bi-bell-slash d-block mb-2" style="font-size:2rem;opacity:0.4;"></i>No notifications right now</td></tr>';
      }
      UI.renderPagination(document.getElementById('notif-pagination'), data, loadNotifications);
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function markAsRead(id) {
    UI.showLoading();
    try {
      await Api.put(`/notifications/${id}/read`);
      UI.showToast('Notification marked as read ✅');
      loadNotifications();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function markAllAsRead() {
    UI.showLoading();
    try {
      await Api.put(`/notifications/user/${Api.getUserId()}/read-all`);
      UI.showToast('All notifications marked as read ✅');
      loadNotifications();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  loadNotifications(0);
</script>
</body>
</html>
