<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Categories — Smart Expense Tracker</title>
  <meta name="description" content="Manage your income and expense categories."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>
  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-tags-fill me-2" style="color:var(--brand-primary-light);font-size:1.2rem;"></i>Category Management</h2>
          <p>Manage your income and expense categories</p>
        </div>
        <div id="add-cat-btn-wrapper">
          <button class="btn btn-glow" onclick="openModal()"><i class="bi bi-plus-lg me-2"></i>Add Category</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr><th>Name</th><th>Type</th><th>Description</th><th id="actions-header">Actions</th></tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-glass">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Category</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:20px 24px;">
        <form id="itemForm" class="glass-form">
          <input type="hidden" id="itemId">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" class="form-control" id="name" placeholder="e.g. Food, Rent, Salary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" id="type" required>
              <option value="EXPENSE">💳 Expense</option>
              <option value="INCOME">💰 Income</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="2" placeholder="Optional description…"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-glow" onclick="saveItem()"><i class="bi bi-check2-circle me-2"></i>Save Category</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('category.html');
  const isReadOnly = Auth.isReadOnly();
  const isAdmin    = Auth.isAdmin();
  if (isReadOnly) {
    document.getElementById('add-cat-btn-wrapper').style.display = 'none';
    const h = document.getElementById('actions-header'); if (h) h.style.display = 'none';
  }

  let myModal = new bootstrap.Modal(document.getElementById('itemModal'));

  async function loadData() {
    UI.showLoading();
    try {
      // No userId param — backend reads userId from JWT
      const data = await Api.get('/categories');
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      const list = Array.isArray(data) ? data : [];
      if (list.length > 0) {
        list.forEach(item => {
          const isIncome = item.type === 'INCOME';
          // ANALYST: no actions; USER: edit only; ADMIN: edit + delete
          const actionsCell = isReadOnly ? '' : `<td>
            <button class="btn btn-sm btn-outline-info me-1" onclick='editItem(${JSON.stringify(item).replace(/'/g,"&#39;")})'  title="Edit"><i class="bi bi-pencil-fill"></i></button>
            ${isAdmin ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})" title="Delete"><i class="bi bi-trash-fill"></i></button>` : ''}
          </td>`;
          tbody.innerHTML += `<tr>
            <td style="font-weight:600;">${item.name}</td>
            <td><span class="badge ${isIncome ? 'income' : 'expense'}">${isIncome ? '💰 Income' : '💳 Expense'}</span></td>
            <td style="font-size:0.82rem;color:var(--text-secondary);">${item.description || '—'}</td>
            ${actionsCell}
          </tr>`;
        });
      } else {
        const cols = isReadOnly ? 3 : 4;
        tbody.innerHTML = `<tr><td colspan="${cols}" class="text-center py-5" style="color:var(--text-muted);"><i class="bi bi-tags d-block mb-2" style="font-size:2rem;opacity:0.4;"></i>No categories found. Add your first category!</td></tr>`;
      }
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  function openModal() {
    if (isReadOnly) return;
    document.getElementById('itemForm').classList.remove('was-validated');
    document.getElementById('itemForm').reset();
    document.getElementById('itemId').value = '';
    document.getElementById('modalTitle').textContent = 'Add Category';
    myModal.show();
  }

  function editItem(item) {
    if (isReadOnly) return;
    document.getElementById('itemForm').classList.remove('was-validated');
    document.getElementById('itemId').value = item.id;
    document.getElementById('name').value = item.name;
    document.getElementById('type').value = item.type;
    document.getElementById('description').value = item.description || '';
    document.getElementById('modalTitle').textContent = 'Edit Category';
    myModal.show();
  }

  async function saveItem() {
    if (isReadOnly) { UI.showToast('Read-only mode.', 'warning'); return; }
    const form = document.getElementById('itemForm');
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;
    const id = document.getElementById('itemId').value;
    const payload = {
      name:        document.getElementById('name').value.trim(),
      type:        document.getElementById('type').value,
      description: document.getElementById('description').value.trim() || null
    };
    UI.showLoading();
    try {
      // No userId param — backend reads from JWT
      if (id) { await Api.put(`/categories/${id}`, payload); UI.showToast('Category updated ✅'); }
      else     { await Api.post('/categories', payload);      UI.showToast('Category added ✅'); }
      myModal.hide();
      form.classList.remove('was-validated');
      loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function deleteItem(id) {
    if (isReadOnly) { UI.showToast('Read-only mode.', 'warning'); return; }
    if (!confirm('Delete this category? Ensure no expenses or incomes are linked to it.')) return;
    UI.showLoading();
    try {
      // No userId param — backend reads from JWT
      await Api.del(`/categories/${id}`);
      UI.showToast('Category deleted ✅'); loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  loadData();
</script>
</body>
</html>
