<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — Smart Expense Tracker</title>
  <meta name="description" content="Create a new Smart Expense Tracker account."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
</head>
<body class="auth-page">
<div class="auth-bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="auth-container" style="max-width:500px;">
  <div class="glass-card auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <h1 class="logo-title">Smart Expense<br/><span>Tracker</span></h1>
    </div>
    <h2 class="auth-heading">Create Account</h2>
    <p class="auth-sub">Start managing your personal & business finances</p>

    <div id="alert-box" class="alert d-none" role="alert"></div>

    <form id="register-form" novalidate>
      <div class="form-floating mb-3">
        <input type="text" class="form-control glass-input" id="fullName" placeholder="Full Name" required autocomplete="name"/>
        <label for="fullName"><i class="bi bi-person-fill me-2"></i>Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control glass-input" id="username" placeholder="Username" required autocomplete="username"/>
        <label for="username"><i class="bi bi-at me-2"></i>Username</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control glass-input" id="email" placeholder="Email" required autocomplete="email"/>
        <label for="email"><i class="bi bi-envelope-fill me-2"></i>Email Address</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control glass-input" id="password" placeholder="Password" required autocomplete="new-password"/>
        <label for="password"><i class="bi bi-lock-fill me-2"></i>Password</label>
        <button type="button" class="btn-toggle-pw" onclick="togglePw('password',this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control glass-input" id="confirmPassword" placeholder="Confirm Password" required autocomplete="new-password"/>
        <label for="confirmPassword"><i class="bi bi-lock-fill me-2"></i>Confirm Password</label>
        <button type="button" class="btn-toggle-pw" onclick="togglePw('confirmPassword',this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <button type="submit" class="btn btn-glow w-100 py-3" id="reg-btn" style="font-size:0.95rem;">
        <span id="reg-text"><i class="bi bi-person-plus-fill me-2"></i>Create Account</span>
        <span id="reg-spinner" class="d-none spinner-border spinner-border-sm"></span>
      </button>
    </form>

    <p class="auth-footer mt-4">Already have an account? <a href="login.html" style="color:var(--accent);font-weight:600;">Sign in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const confirmPw = document.getElementById('confirmPassword').value;

    if (pw !== confirmPw) {
      showAlert('danger', '❌ Passwords do not match!');
      return;
    }

    if (pw.length < 6) {
      showAlert('danger', '❌ Password must be at least 6 characters long!');
      return;
    }

    const btn = document.getElementById('reg-btn');
    const text = document.getElementById('reg-text');
    const spinner = document.getElementById('reg-spinner');
    btn.disabled = true; text.classList.add('d-none'); spinner.classList.remove('d-none');

    try {
      await Auth.register({
        fullName: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: pw
      });
      showAlert('success', '🎉 Account created successfully! Signing in…');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    } catch (err) {
      showAlert('danger', `❌ Registration failed: ${err.message}`);
    } finally {
      btn.disabled = false; text.classList.remove('d-none'); spinner.classList.add('d-none');
    }
  });

  function showAlert(type, msg) {
    const box = document.getElementById('alert-box');
    box.className = `alert alert-${type}`;
    box.innerHTML = msg;
  }

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    btn.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
  }
</script>
</body>
</html>
