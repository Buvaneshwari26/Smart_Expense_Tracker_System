<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management — Smart Expense Tracker</title>
  <meta name="description" content="Manage user roles, status, activation, and lock status."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-people-fill me-2" style="color:var(--brand-primary-light);font-size:1.2rem;"></i>User Management</h2>
          <p>Manage system users, assign roles (ADMIN, USER, ANALYST), and update access status</p>
        </div>
      </div>

      <div class="glass-card">
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>User Details</th>
                <th>Role</th>
                <th>Account Status</th>
                <th>Lock Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
        <div id="users-pagination" class="mt-4 d-flex justify-content-end"></div>
      </div>
    </div>
  </main>
</div>

<!-- Change Role Modal -->
<div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-glass">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change User Role</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:20px 24px;">
        <input type="hidden" id="roleUserId">
        <div class="mb-3">
          <label class="form-label">Select New Role</label>
          <select class="form-select" id="newRoleSelect">
            <option value="USER">👤 USER (Standard Access)</option>
            <option value="ADMIN">🛡️ ADMIN (Full System Access)</option>
            <option value="ANALYST">👁️ ANALYST (Read-Only Access)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-glow" onclick="saveUserRole()"><i class="bi bi-check2-circle me-2"></i>Update Role</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth('ADMIN');
  UI.initSidebar('admin-users.html');

  let roleModal = new bootstrap.Modal(document.getElementById('roleModal'));

  async function loadUsers(page = 0) {
    UI.showLoading();
    try {
      const data = await Api.get(`/users?page=${page}&size=10`);
      const tbody = document.getElementById('users-tbody');
      tbody.innerHTML = '';
      if (data.content && data.content.length > 0) {
        data.content.forEach(u => {
          const roleBadgeClass = u.role === 'ADMIN' ? 'admin' : u.role === 'ANALYST' ? 'analyst' : 'income';
          const isCurrentAdmin = u.id === Api.getUserId();

          tbody.innerHTML += `<tr>
            <td style="font-size:0.8rem;color:var(--text-muted);">#${u.id}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${u.profilePicture || UI.DEFAULT_AVATAR}" class="rounded-circle" style="width:32px;height:32px;object-fit:cover;border:1px solid var(--glass-border);" onerror="this.src=UI.DEFAULT_AVATAR">
                <div>
                  <div style="font-weight:600;font-size:0.875rem;">${u.fullName || u.username}</div>
                  <div style="font-size:0.75rem;color:var(--text-muted);">${u.email}</div>
                </div>
              </div>
            </td>
            <td><span class="badge ${roleBadgeClass}">${u.role}</span></td>
            <td>
              <span class="badge ${u.active ? 'income' : 'expense'}">${u.active ? 'Active' : 'Inactive'}</span>
            </td>
            <td>
              <span class="badge ${u.accountNonLocked ? 'income' : 'expense'}">${u.accountNonLocked ? 'Unlocked' : 'Locked'}</span>
            </td>
            <td>
              ${isCurrentAdmin ? '<span class="text-muted small">Current Admin</span>' : `
                <button class="btn btn-sm btn-outline-info me-1" onclick="openRoleModal(${u.id}, '${u.role}')" title="Change Role"><i class="bi bi-shield-lock me-1"></i>Role</button>
                <button class="btn btn-sm ${u.active ? 'btn-outline-warning' : 'btn-outline-success'} me-1" onclick="toggleUserActive(${u.id}, ${!u.active})" title="Toggle Active">${u.active ? 'Deactivate' : 'Activate'}</button>
                <button class="btn btn-sm ${u.accountNonLocked ? 'btn-outline-danger' : 'btn-outline-primary'}" onclick="toggleUserLock(${u.id}, ${u.accountNonLocked})" title="Toggle Lock">${u.accountNonLocked ? 'Lock' : 'Unlock'}</button>
              `}
            </td>
          </tr>`;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4" style="color:var(--text-muted);">No users found.</td></tr>';
      }
      UI.renderPagination(document.getElementById('users-pagination'), data, loadUsers);
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  function openRoleModal(userId, currentRole) {
    document.getElementById('roleUserId').value = userId;
    document.getElementById('newRoleSelect').value = currentRole;
    roleModal.show();
  }

  async function saveUserRole() {
    const userId = document.getElementById('roleUserId').value;
    const role = document.getElementById('newRoleSelect').value;
    UI.showLoading();
    try {
      await Api.put(`/admin/users/${userId}/role?role=${role}`);
      UI.showToast('User role updated successfully ✅');
      roleModal.hide(); loadUsers();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function toggleUserActive(userId, active) {
    UI.showLoading();
    try {
      await Api.put(`/admin/users/${userId}/status?active=${active}`);
      UI.showToast(`User ${active ? 'activated' : 'deactivated'} successfully ✅`);
      loadUsers();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function toggleUserLock(userId, currentlyUnlocked) {
    UI.showLoading();
    try {
      if (currentlyUnlocked) {
        await Api.put(`/admin/users/${userId}/lock`);
        UI.showToast('User account locked 🔒');
      } else {
        await Api.put(`/admin/users/${userId}/unlock`);
        UI.showToast('User account unlocked 🔓');
      }
      loadUsers();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  loadUsers(0);
</script>
</body>
</html>
