<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Planner — Smart Expense Tracker</title>
  <meta name="description" content="Set spending limits and monitor budget utilization across categories."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="css/globals.css"/>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>
<button class="sidebar-toggle d-md-none"><i class="bi bi-list"></i></button>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div><div class="brand-text">ExpenseTracker</div><div class="brand-tagline">Smart Finance</div></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer"><span id="sidebar-username">User</span></div>
  </aside>

  <main class="main-content">
    <div class="page-content">
      <div class="page-header">
        <div class="page-header-title">
          <h2><i class="bi bi-pie-chart-fill me-2" style="color:var(--warning);font-size:1.2rem;"></i>Budget Planner</h2>
          <p>Set spending limits and prevent overspending by category</p>
        </div>
        <div id="add-btn-wrapper">
          <button class="btn btn-glow" onclick="openModal()"><i class="bi bi-plus-lg me-2"></i>Create Budget</button>
        </div>
      </div>

      <!-- Month Selector -->
      <div class="glass-card mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-2">
          <label class="form-label mb-0 fw-600">Select Month & Year:</label>
          <input type="month" class="form-control glass-input" id="monthPicker" style="width:180px;" onchange="loadData()">
        </div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">
          <i class="bi bi-info-circle me-1"></i>Budgets monitor expense thresholds per category.
        </div>
      </div>

      <!-- Table / Cards -->
      <div class="glass-card">
        <div class="table-responsive">
          <table class="glass-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Limit</th>
                <th>Spent</th>
                <th>Remaining</th>
                <th>Utilization</th>
                <th id="actions-header">Actions</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-glass">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Create Budget</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="padding:20px 24px;">
        <form id="itemForm" class="glass-form">
          <input type="hidden" id="itemId">
          <div class="mb-3">
            <label class="form-label">Expense Category</label>
            <select class="form-select" id="categoryId" required><option value="">Select Category</option></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Monthly Limit (₹)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="limitAmount" placeholder="0.00" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Month (1-12)</label>
              <input type="number" min="1" max="12" class="form-control" id="month" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Year</label>
              <input type="number" min="2020" max="2035" class="form-control" id="year" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-glow" onclick="saveItem()"><i class="bi bi-check2-circle me-2"></i>Save Budget</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  Auth.requireAuth();
  UI.initSidebar('budget.html');
  const isReadOnly = Auth.isReadOnly();
  if (isReadOnly) {
    document.getElementById('add-btn-wrapper').style.display = 'none';
    const h = document.getElementById('actions-header'); if (h) h.style.display = 'none';
  }

  let myModal = new bootstrap.Modal(document.getElementById('itemModal'));

  // Default month picker to current month
  const now = new Date();
  const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  document.getElementById('monthPicker').value = currentMonthStr;

  async function loadCategories() {
    try {
      const data = await Api.get(`/categories?userId=${Api.getUserId()}`);
      const cats = Array.isArray(data) ? data.filter(c => c.type === 'EXPENSE') : [];
      document.getElementById('categoryId').innerHTML = '<option value="">Select Category</option>' +
        cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    } catch (err) { console.error('Failed to load categories', err); }
  }

  async function loadData() {
    UI.showLoading();
    try {
      const val = document.getElementById('monthPicker').value || currentMonthStr;
      const [year, month] = val.split('-');
      const data = await Api.get(`/budgets/user/${Api.getUserId()}?year=${year}&month=${parseInt(month)}`);
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      const list = Array.isArray(data) ? data : [];
      if (list.length > 0) {
        list.forEach(item => {
          const util = Math.min(100, item.utilizationPercent || 0);
          const barColor = item.isExceeded ? 'var(--danger)' : util > 75 ? 'var(--warning)' : 'var(--accent)';
          const remaining = (item.limitAmount || 0) - (item.spentAmount || 0);
          const actionsCell = isReadOnly ? '' : `<td>
            <button class="btn btn-sm btn-outline-info me-1" onclick='editItem(${JSON.stringify(item).replace(/'/g,"&#39;")})' title="Edit"><i class="bi bi-pencil-fill"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})" title="Delete"><i class="bi bi-trash-fill"></i></button>
          </td>`;

          tbody.innerHTML += `<tr>
            <td style="font-weight:600;">${item.categoryName || 'General'}</td>
            <td style="font-weight:700;">${UI.formatCurrency(item.limitAmount)}</td>
            <td style="color:${item.spentAmount > item.limitAmount ? 'var(--danger)' : 'var(--text-primary)'};font-weight:600;">${UI.formatCurrency(item.spentAmount)}</td>
            <td style="color:${remaining < 0 ? 'var(--danger)' : 'var(--accent)'};">${UI.formatCurrency(remaining)}</td>
            <td style="width:200px;">
              <div class="d-flex align-items-center justify-content-between mb-1" style="font-size:0.75rem;">
                <span class="${item.isExceeded ? 'text-danger fw-700' : ''}">${util.toFixed(1)}%</span>
                ${item.isExceeded ? '<span class="badge badge-danger" style="background:rgba(244,63,94,0.15);color:var(--danger);">EXCEEDED</span>' : ''}
              </div>
              <div class="progress-bar-custom">
                <div class="fill" style="width:${util}%;background:${barColor};"></div>
              </div>
            </td>
            ${actionsCell}
          </tr>`;
        });
      } else {
        const cols = isReadOnly ? 5 : 6;
        tbody.innerHTML = `<tr><td colspan="${cols}" class="text-center py-5" style="color:var(--text-muted);"><i class="bi bi-pie-chart d-block mb-2" style="font-size:2rem;opacity:0.4;"></i>No budget limits set for this month.</td></tr>`;
      }
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  function openModal() {
    if (isReadOnly) return;
    document.getElementById('itemForm').reset();
    document.getElementById('itemId').value = '';
    const [y, m] = (document.getElementById('monthPicker').value || currentMonthStr).split('-');
    document.getElementById('month').value = parseInt(m);
    document.getElementById('year').value = y;
    document.getElementById('modalTitle').textContent = 'Create Budget';
    myModal.show();
  }

  function editItem(item) {
    if (isReadOnly) return;
    document.getElementById('itemId').value = item.id;
    document.getElementById('categoryId').value = item.categoryId;
    document.getElementById('limitAmount').value = item.limitAmount;
    document.getElementById('month').value = item.month;
    document.getElementById('year').value = item.year;
    document.getElementById('modalTitle').textContent = 'Edit Budget';
    myModal.show();
  }

  async function saveItem() {
    if (isReadOnly) return;
    const form = document.getElementById('itemForm');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const id = document.getElementById('itemId').value;
    const payload = {
      categoryId: document.getElementById('categoryId').value,
      limitAmount: document.getElementById('limitAmount').value,
      month: document.getElementById('month').value,
      year: document.getElementById('year').value
    };
    UI.showLoading();
    try {
      if (id) { await Api.put(`/budgets/${id}?userId=${Api.getUserId()}`, payload); UI.showToast('Budget updated ✅'); }
      else { await Api.post(`/budgets?userId=${Api.getUserId()}`, payload); UI.showToast('Budget created ✅'); }
      myModal.hide(); loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  async function deleteItem(id) {
    if (isReadOnly) return;
    if (!confirm('Delete this budget?')) return;
    UI.showLoading();
    try {
      await Api.del(`/budgets/${id}?userId=${Api.getUserId()}`);
      UI.showToast('Budget deleted ✅'); loadData();
    } catch (err) { UI.showToast(err.message, 'error'); } finally { UI.hideLoading(); }
  }

  loadCategories().then(() => loadData());
</script>
</body>
</html>
